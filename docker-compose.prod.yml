version: '3.8'

services:
  # Production server
  app:
    build:
      context: .
      dockerfile: Dockerfile.image
      target: release
    image: shelf-prod:latest
    container_name: shelf-prod
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - shelf
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - SUPABASE_ANON_PUBLIC=${SUPABASE_ANON_PUBLIC}
      - SUPABASE_SERVICE_ROLE=${SUPABASE_SERVICE_ROLE}
      - SUPABASE_URL=${SUPABASE_URL}
      - SERVER_URL=${SERVER_URL}
      - APP_NAME=${APP_NAME:-Shelf}
      - FINGERPRINT=${FINGERPRINT:-}
      - ENABLE_PREMIUM_FEATURES=${ENABLE_PREMIUM_FEATURES:-false}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DISABLE_SSO=${DISABLE_SSO:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY:-}
      - STRIPE_WEBHOOK_ENDPOINT_SECRET=${STRIPE_WEBHOOK_ENDPOINT_SECRET:-}
      - FREE_TRIAL_DAYS=${FREE_TRIAL_DAYS:-14}
      - SMTP_PWD=${SMTP_PWD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_FROM=${SMTP_FROM}
      - SEND_ONBOARDING_EMAIL=${SEND_ONBOARDING_EMAIL:-true}
      - MAPTILER_TOKEN=${MAPTILER_TOKEN:-}
      - GEOCODING_USER_AGENT=${GEOCODING_USER_AGENT:-shelf.nu}
      - MICROSOFT_CLARITY_ID=${MICROSOFT_CLARITY_ID:-}
      - INVITE_TOKEN_SECRET=${INVITE_TOKEN_SECRET}
      - SENTRY_ORG=${SENTRY_ORG:-}
      - SENTRY_PROJECT=${SENTRY_PROJECT:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
networks:
  shelf:
    driver: bridge